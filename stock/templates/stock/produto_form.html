{% extends "base.html" %}
{% load static %}

{% block extra_css %}
    <link rel="stylesheet" type="text/css" href="{% static 'stock/css/produto_form.css' %}">
{% endblock %}

{% block title %}Cadastrar Produto{% endblock %}

{% block content %}
    <h1>Cadastrar Produto</h1>
    
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Salvar</button>
    </form>
{% endblock %}
